# Pull-request gate for the training/export code.
#
# Distinct from the four scheduled workflows in this directory: those refresh data and
# retrain the model on a timer, this one just proves the code is sound before it merges.
# It touches no network, no data bundle, and no model artifact.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Match the scheduled workflows: keep BLAS single-threaded so numeric results are
  # reproducible run to run.
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the scheduled retrain runs on; 3.12 is what mma.ai serves with.
        # Both are tested so the model is never trained on an interpreter the deploy
        # side does not use.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest -q

  parity-fixture:
    name: parity fixture is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # mma.ai asserts its feature port against a fixture generated from this repo. If a
      # change here moves the vectors, the committed fixture is stale and mma.ai's guard
      # would be validating against the old semantics — so regenerate and diff.
      - name: Regenerate parity vectors
        run: python scripts/export_parity_vectors.py --out /tmp/parity_vectors.json

      - name: Compare against the copy committed in mma.ai
        run: |
          if [ ! -f tests/fixtures/parity_vectors.json ]; then
            echo "No local copy to compare; skipping."
            exit 0
          fi
          diff -u tests/fixtures/parity_vectors.json /tmp/parity_vectors.json || {
            echo ""
            echo "::error::Parity vectors changed. Regenerate the fixture in BOTH repos:"
            echo "  python scripts/export_parity_vectors.py --out tests/fixtures/parity_vectors.json"
            echo "  python scripts/export_parity_vectors.py --out ../mma.ai/tests/fixtures/parity_vectors.json"
            exit 1
          }
