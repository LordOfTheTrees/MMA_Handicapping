# Weekly: restore last bundle → ESPN incremental delta → refresh ELO + matrix + export (W unchanged).
# Full history rescrape is manual/local only — not automated here.
# State forwarding: downloads newest ``mma-model-state`` artifact (``data/model.pkl``), then uploads
# that name again after success so the next run can restore without AWS/extra repos.
# Cold start (no artifact yet): full ``train`` + ``export_artifacts`` once.
# ``upcoming_events.json`` is only exported when ``ci_try_refresh_data`` reports a fresh
# UFCStats upcoming-cards scrape this run (``espn_refresh.outputs.upcoming_scraped``) — otherwise
# UFCStats was Cloudflare-blocked and ``data/upcoming_cards.json`` is stale, so we skip re-shipping it.
#
# Annual hyperparameter search stays local; not automated here.
#
# Schedule: GitHub cron is UTC-only. Monday 03:00 Eastern Standard Time → 08:00 UTC.
# When the 1st is a Monday, scheduled weekly is skipped — monthly retrain owns that slot.

name: Weekly model refresh

on:
  workflow_dispatch:
    inputs:
      skip_espn_refresh:
        description: >-
          Skip ESPN incremental ingest; use restored bundle CSVs only (debug).
          Default false — normal runs restore bundle then fetch new results since last run.
        type: boolean
        default: false
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read
  actions: write

concurrency:
  group: mma-model-pipeline
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run_refresh: ${{ steps.pick.outputs.run_refresh }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_refresh=true" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%d)" = "01" ]; then
            echo "run_refresh=false" >> $GITHUB_OUTPUT
            echo "**Skipped:** First of month — \`monthly-model-retrain\` covers scrape + retrain; weekly refresh not needed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run_refresh=true" >> $GITHUB_OUTPUT
          fi

  refresh:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run_refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore model.pkl from latest mma-model-state artifact
        id: restore_state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_restore_model_artifact.py

      - name: Restore data CSVs from last run bundle
        id: restore_bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_restore_data_bundle.py

      - name: Refresh fight data (ESPN incremental; fail if no updates)
        id: espn_refresh
        if: >-
          github.event_name != 'workflow_dispatch' || inputs.skip_espn_refresh != true
        run: python scripts/ci_try_refresh_data.py

      - name: Refresh pipeline (ELO + matrix, keep W)
        if: steps.restore_state.outputs.seed == 'true'
        # Script defaults to refresh_data(); avoid double scrape after step above.
        run: python scripts/weekly_update.py refresh --data-dir ./data --model-path ./data/model.pkl --out-dir ./JSON_exports --no-scrape

      - name: Cold start — full train (no prior pickle)
        if: steps.restore_state.outputs.seed != 'true'
        run: python main.py --model-path ./data/model.pkl train --data-dir ./data --no-scrape --no-holdout

      - name: Cold start — export JSON
        if: steps.restore_state.outputs.seed != 'true'
        run: python scripts/export_artifacts.py --model-path ./data/model.pkl --out-dir ./JSON_exports

      - name: Export upcoming events JSON (only when UFCStats scrape completed this run)
        if: steps.espn_refresh.outputs.upcoming_scraped == 'true'
        run: python scripts/export_upcoming_events.py --cards ./data/upcoming_cards.json --out ./JSON_exports/upcoming_events.json

      - name: Upload model pickle for next run (mma-model-state)
        uses: actions/upload-artifact@v4
        with:
          name: mma-model-state
          path: data/model.pkl
          if-no-files-found: error

      - name: Upload run bundle (CSVs, JSON exports)
        uses: actions/upload-artifact@v4
        with:
          name: weekly-refresh-${{ github.run_id }}
          path: |
            data/ufcstats_fights.csv
            data/fighter_profiles.csv
            data/espn_crosswalk_fights.csv
            data/espn_crosswalk_fighters.csv
            data/espn_ingest_state.json
            data/espn_ingest_audit.json
            data/upcoming_cards.json
            JSON_exports/
          if-no-files-found: warn
