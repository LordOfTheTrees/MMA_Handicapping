# Monthly: restore last bundle → ESPN incremental delta → full retrain + bootstrap + export.
# Full history rescrape is manual/local only — not automated here.
# Same artifact forwarding as weekly: restore ``mma-model-state`` / upload after success.
# Cold start: full ``train`` + ``export_artifacts`` (matches initial CI bootstrap).
# ``upcoming_events.json`` is only exported when ``ci_try_refresh_data`` reports a fresh
# UFCStats upcoming-cards scrape this run (``espn_refresh.outputs.upcoming_scraped``) — otherwise
# UFCStats was Cloudflare-blocked and ``data/upcoming_cards.json`` is stale, so we skip re-shipping it.
#
# Re-hyperparameterization stays local.
#
# Schedule: 1st of month 03:00 EST → 08:00 UTC.

name: Monthly model retrain (bootstrap)

on:
  workflow_dispatch:
    inputs:
      skip_espn_refresh:
        description: >-
          Skip ESPN incremental ingest; use restored bundle CSVs only (debug).
          Default false — normal runs restore bundle then fetch new results since last run.
        type: boolean
        default: false
  schedule:
    - cron: "0 8 1 * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: mma-model-pipeline
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1
  MKL_NUM_THREADS: 1

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore model.pkl from latest mma-model-state artifact
        id: restore_state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_restore_model_artifact.py

      - name: Restore data CSVs from last run bundle
        id: restore_bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_restore_data_bundle.py

      - name: Refresh fight data (ESPN incremental; fail if no updates)
        id: espn_refresh
        if: >-
          github.event_name != 'workflow_dispatch' || inputs.skip_espn_refresh != true
        run: python scripts/ci_try_refresh_data.py

      - name: Full retrain + bootstrap + export
        if: steps.restore_state.outputs.seed == 'true'
        # Script defaults to refresh_data(); avoid double scrape after step above.
        run: python scripts/weekly_update.py retrain --data-dir ./data --model-path ./data/model.pkl --out-dir ./JSON_exports --no-scrape

      - name: Cold start — full train + export (no prior pickle)
        if: steps.restore_state.outputs.seed != 'true'
        run: |
          python main.py --model-path ./data/model.pkl train --data-dir ./data --no-scrape --no-holdout
          python scripts/export_artifacts.py --model-path ./data/model.pkl --out-dir ./JSON_exports

      - name: Export upcoming events JSON (only when UFCStats scrape completed this run)
        if: steps.espn_refresh.outputs.upcoming_scraped == 'true'
        run: python scripts/export_upcoming_events.py --cards ./data/upcoming_cards.json --out ./JSON_exports/upcoming_events.json

      - name: Upload model pickle for next run (mma-model-state)
        uses: actions/upload-artifact@v4
        with:
          name: mma-model-state
          path: data/model.pkl
          if-no-files-found: error

      - name: Upload run bundle (CSVs, JSON exports)
        uses: actions/upload-artifact@v4
        with:
          name: monthly-retrain-${{ github.run_id }}
          path: |
            data/ufcstats_fights.csv
            data/fighter_profiles.csv
            data/espn_crosswalk_fights.csv
            data/espn_crosswalk_fighters.csv
            data/espn_ingest_state.json
            data/upcoming_cards.json
            JSON_exports/
          if-no-files-found: warn
